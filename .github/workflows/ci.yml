name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: orderly_ci_test
      DB_USERNAME: orderly_ci
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: orderly_ci_test
          POSTGRES_USER: orderly_ci
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orderly_ci -d orderly_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, mbstring
          coverage: none
          tools: composer:v2

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check PHP platform requirements
        run: composer check-platform-reqs

      - name: Prepare Laravel
        run: |
          php artisan key:generate --force
          php artisan config:clear

      - name: Run database migrations
        run: php artisan migrate --env=testing --force

      - name: Run backend tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: /api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build